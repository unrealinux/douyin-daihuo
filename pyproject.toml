[project]
name = "daihuo"
version = "0.1.0"
description = "视频号图书带货文案流水线：对标逐字稿 → A/B 版文案 + 合规检测"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
daihuo = "daihuo.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["daihuo"]
